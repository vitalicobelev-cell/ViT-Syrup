<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ViT-Syrup</title>

    <!-- Стили -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

    <!-- ==========================================
         ЛОГОТИП
    =========================================== -->

    <div id="logo">

        ViT-Syrup

    </div>


    <!-- ==========================================
         ВЫБОР ФИРМЫ
    =========================================== -->

    <div class="selector" id="companyCard">

        <button id="companyPrev">

            ◀

        </button>

        <div id="companyName">

            Monin

        </div>

        <button id="companyNext">

            ▶

        </button>

    </div>


    <!-- ==========================================
         ВЫБОР БУТЫЛКИ
    =========================================== -->

    <div class="selector" id="bottleCard">

        <button id="bottlePrev">

            ◀

        </button>

        <div id="bottleName">

            Стекло 0.7 л

        </div>

        <button id="bottleNext">

            ▶

        </button>

    </div>


    <!-- ==========================================
         ВЫБОР ПОМПЫ
    =========================================== -->

    <div class="selector" id="pumpCard">

        <button id="pumpPrev">

            ◀

        </button>

        <div id="pumpName">

            Без помпы

        </div>

        <button id="pumpNext">

            ▶

        </button>

    </div>


    <!-- ==========================================
         ПРИМЕЧАНИЕ
    =========================================== -->

    <div id="note">

    </div>


    <!-- ==========================================
         ВЕС
    =========================================== -->

    <div class="caption">

        Вес (кг)

    </div>

   <input
    id="weight"
    type="text"
    inputmode="decimal"
    autocomplete="off"
    spellcheck="false"
        placeholder="от 499 г">

        <!-- ==========================================
         РЕЗУЛЬТАТ
    =========================================== -->

    <div class="caption">

        Остаток

    </div>

    <div id="resultBox">

        <div id="result">

            Ошибка

        </div>

        <div id="copyMark">

            ✔

        </div>

    </div>

</div>


<!-- ==========================================
     ДАННЫЕ
========================================== -->

<script src="data.js"></script>


<!-- ==========================================
     ЛОГИКА
========================================== -->

<script src="app.js"></script>

</body>

</html>
