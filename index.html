<style>

/* ======================================================
                    ОБЩИЕ НАСТРОЙКИ
====================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#1d2330;

    color:white;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}

/* ======================================================
                 ОСНОВНОЙ КОНТЕЙНЕР

Если хочется сделать приложение шире,
менять max-width.

====================================================== */

#app{

    max-width:430px;

    margin:auto;

    padding:18px;

}

/* ======================================================
                     ЛОГОТИП

Можно менять:

font-size
margin

====================================================== */

#logo{

    text-align:center;

    font-size:34px;

    font-weight:bold;

    margin:18px 0 22px;

}

/* ======================================================
                     КАРТОЧКИ

Используются для:

Фирма
Тара
Помпа

====================================================== */

.selector{

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:#2b3447;

    border-radius:18px;

    padding:14px;

    margin-bottom:14px;

}

/* ======================================================
                    КНОПКИ ◀ ▶

Если хочется увеличить стрелки —
менять width и height.

====================================================== */

.arrow{

    width:52px;

    height:52px;

    border:none;

    border-radius:14px;

    background:#3b4961;

    color:white;

    font-size:22px;

    cursor:pointer;

    transition:.15s;

}

.arrow:active{

    transform:scale(.94);

}

/* ======================================================
                    ТЕКСТ В КАРТОЧКАХ

====================================================== */

.selector-name{

    flex:1;

    text-align:center;

    font-size:20px;

    font-weight:bold;

}

/* ======================================================
                    ПРИМЕЧАНИЕ

====================================================== */

#note{

    text-align:center;

    color:#8ec3ff;

    min-height:24px;

    margin:12px 0 22px;

    font-size:20px;

}

/* ======================================================
                    ЗАГОЛОВОК ПОЛЯ

====================================================== */

.label{

    color:#9db3d3;

    margin-bottom:8px;

    font-size:16px;

}

/* ======================================================
                    ПОЛЕ ВВОДА

Менять можно:

height
font-size

====================================================== */

#weight{

    width:100%;

    height:64px;

    border:none;

    border-radius:16px;

    background:#2b3447;

    color:white;

    text-align:center;

    font-size:34px;

    margin-bottom:22px;

}

#weight::placeholder{

    color:#7d8ca6;

}

/* ======================================================
                    РЕЗУЛЬТАТ

====================================================== */

#resultRow{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:10px;

}

#result{

    font-size:64px;

    font-weight:bold;

    color:#6cb3ff;

    cursor:pointer;

    user-select:none;

    transition:.25s;

}

/* ======================================================
               АНИМАЦИЯ КОПИРОВАНИЯ

====================================================== */

.resultCopied{

    color:#35d26d !important;

    transform:scale(1.06);

}

#check{

    font-size:24px;

    color:#35d26d;

    opacity:0;

    transition:.25s;

}

.showCheck{

    opacity:1;

}

<!-- ===================================================
     СЛЕДУЮЩАЯ ЧАСТЬ

1. Настройки
2. Данные бутылок
3. Данные помп

=================================================== -->
<script>

/* ==========================================================
                     НАСТРОЙКИ

Менять только здесь.

multiplier
— коэффициент пересчёта

pumpWeight
— вес одной помпы

decimals
— количество знаков после запятой

========================================================== */

const SETTINGS={

    multiplier:0.77,

    pumpWeight:35,

    decimals:3

};


/* ==========================================================
                     ДАННЫЕ БУТЫЛОК

Если изменятся веса бутылок —
менять только здесь.

tare
— вес пустой бутылки

volume
— объём

========================================================== */

const DATA=[

{

company:"Rioba",

note:"",

bottles:[

{

name:"Стекло 0.7 л",

volume:0.7,

tare:498

}

]

},

{

company:"Monin",

note:"",

bottles:[

{

name:"Стекло 1 л",

volume:1,

tare:532

},

{

name:"Стекло 0.7 л",

volume:0.7,

tare:464

},

{

name:"Пластик 1 л",

volume:1,

tare:75

}

]

},

{

company:"Maribell",

note:"Все сиропы с помпой",

bottles:[

{

name:"Стекло 0.7 л",

volume:0.7,

tare:454

}

]

},

{

company:"1883",

note:"Можно без помпы",

bottles:[

{

name:"Стекло 1 л",

volume:1,

tare:463

}

]

}

];


/* ==========================================================
                     ПОМПЫ

Без помпы

Помпа 1883

========================================================== */

const PUMPS=[

{

name:"Без помпы",

weight:0

},

{

name:"Помпа 1883",

weight:SETTINGS.pumpWeight

}

];


/* ==========================================================
                  СОСТОЯНИЕ ПРИЛОЖЕНИЯ

Запоминает,
что выбрал пользователь.

========================================================== */

let companyIndex=0;

let bottleIndex=0;

let pumpIndex=0;

</script>

<script>

/* ==========================================================
                    ПОИСК ЭЛЕМЕНТОВ
========================================================== */

const companyName=document.getElementById("companyName");
const bottleName=document.getElementById("bottleName");
const pumpName=document.getElementById("pumpName");

const note=document.getElementById("note");

const weight=document.getElementById("weight");

const result=document.getElementById("result");

const check=document.getElementById("check");


/* ==========================================================
                  ТЕКУЩИЕ ОБЪЕКТЫ

Чтобы не писать длинные строки.

========================================================== */

function currentCompany(){

    return DATA[companyIndex];

}

function currentBottle(){

    return DATA[companyIndex].bottles[bottleIndex];

}

function currentPump(){

    return PUMPS[pumpIndex];

}


/* ==========================================================
                 ОБНОВЛЕНИЕ ЭКРАНА

Вызывается после любого изменения.

========================================================== */

function updateScreen(){

    companyName.textContent=currentCompany().company;

    bottleName.textContent=currentBottle().name;

    pumpName.textContent=currentPump().name;

    note.textContent=currentCompany().note;

    calculate();

}


/* ==========================================================
                 СТРЕЛКИ ФИРМЫ

При смене фирмы автоматически
переходим на первую бутылку.

========================================================== */

companyPrev.onclick=function(){

    companyIndex--;

    if(companyIndex<0){

        companyIndex=DATA.length-1;

    }

    bottleIndex=0;

    updateScreen();

};


companyNext.onclick=function(){

    companyIndex++;

    if(companyIndex>=DATA.length){

        companyIndex=0;

    }

    bottleIndex=0;

    updateScreen();

};


/* ==========================================================
                 СТРЕЛКИ ТАРЫ
========================================================== */

bottlePrev.onclick=function(){

    bottleIndex--;

    if(bottleIndex<0){

        bottleIndex=currentCompany().bottles.length-1;

    }

    updateScreen();

};


bottleNext.onclick=function(){

    bottleIndex++;

    if(bottleIndex>=currentCompany().bottles.length){

        bottleIndex=0;

    }

    updateScreen();

};


/* ==========================================================
                 СТРЕЛКИ ПОМПЫ
========================================================== */

pumpPrev.onclick=function(){

    pumpIndex--;

    if(pumpIndex<0){

        pumpIndex=PUMPS.length-1;

    }

    updateScreen();

};


pumpNext.onclick=function(){

    pumpIndex++;

    if(pumpIndex>=PUMPS.length){

        pumpIndex=0;

    }

    updateScreen();

};

</script>

<script>

/* ==========================================================
                    ФОРМУЛА РАСЧЁТА

Формула:

(Вес - Тара - Помпа)
× Коэффициент
÷ (1000 × Объём)

========================================================== */

function calculate(){

    const value=parseFloat(weight.value);

    if(isNaN(value)){

        result.textContent="0.000";

        return;

    }

    const bottle=currentBottle();

    const pump=currentPump();

    const syrup=

        (value-bottle.tare-pump.weight)

        *SETTINGS.multiplier

        /(1000*bottle.volume);

    result.textContent=syrup.toFixed(SETTINGS.decimals);

}


/* ==========================================================
                АВТООЧИСТКА ПОЛЯ

При нажатии удаляет старое значение.

========================================================== */

weight.addEventListener("focus",function(){

    if(weight.value!=""){

        weight.value="";

    }

});


/* ==========================================================
              АВТОМАТИЧЕСКИЙ ПЕРЕСЧЁТ

========================================================== */

weight.addEventListener("input",calculate);


/* ==========================================================
                 КОПИРОВАНИЕ

========================================================== */

result.addEventListener("click",async function(){

    try{

        await navigator.clipboard.writeText(result.textContent);

    }catch(e){

        return;

    }

    result.classList.add("resultCopied");

    check.classList.add("showCheck");

    setTimeout(function(){

        result.classList.remove("resultCopied");

        check.classList.remove("showCheck");

    },500);

});


/* ==========================================================
                 ПЕРВЫЙ ЗАПУСК

========================================================== */

updateScreen();

</script>
  
</body>
